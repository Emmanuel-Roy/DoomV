# The stand-in for a core's retirement port (retire_port.hpp): a Vitis HLS
# component as corun.py --lockstep and lockstep_lib.py run one. Paths are
# relative to this folder; the target part and clock, and the flags that
# link the testbench with DoomV's library, are added by the harness.
#
# A core's component has the same shape, and its testbench the same
# contract (corun.py, "--lockstep"): it reads DOOMV_LS_ARGS, DOOMV_LS_ELF and
# DOOMV_LS_LIMIT from the environment, runs the program, hands every record
# it retires to doomv_ls_open_line(DOOMV_LS_ARGS)'s machine, prints
# doomv_ls_message on a mismatch, and returns 0 only if every record matched.
[hls]
syn.file=retire_port.cpp
syn.top=retire_port
tb.file=retire_tb.cpp
